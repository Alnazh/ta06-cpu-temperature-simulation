<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulasi interaktif suhu CPU laptop dengan kipas: model ODE orde 1, metode Euler, enam skenario beban.">
  <title>{% block title %}{% endblock %} | CPU Temp Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b197fc'/%3E%3Crect x='2' y='2' width='28' height='28' fill='%23fff' stroke='%23111' stroke-width='3'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='900' text-anchor='middle'%3E%C2%B0C%3C/text%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b197fc'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' fill='none' stroke='%23111' stroke-width='3'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='900' text-anchor='middle' font-family='Arial'%3E°C%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">°C</span> CPU Temp Lab</a>
    <nav aria-label="Navigasi utama">
      {% for endpoint, label in (('index', 'Beranda'), ('simulator', 'Simulator'), ('kipas', 'Kipas'), ('model', 'Model')) %}
      <a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p><b>CPU Temp Lab</b> &middot; Dibuat dengan Flask, HTML, CSS, dan JavaScript</p>
  </footer>

  <script src="{{ url_for('static', filename='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
